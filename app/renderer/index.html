<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' file:; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prumo QA</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <header>
    <div class="marca"><img src="../../assets/prumo-icon.png" alt="" width="24" height="24"><strong>Prumo QA</strong><span id="versao" class="suave"></span></div>
    <div class="projeto"><span class="suave">Projeto</span> <strong id="projeto-atual">nenhum selecionado</strong></div>
    <nav id="nav" aria-label="Seções">
      <button data-aba="projetos">Projetos</button>
      <button data-aba="contextos">Contextos</button>
      <button data-aba="metricas">Métricas</button>
      <button data-aba="logs">Logs</button>
      <button data-aba="historico">Histórico</button>
      <button data-aba="evidencias">Evidências</button>
      <button data-aba="conexoes">Conexões</button>
      <button data-aba="suporte">Suporte</button>
      <button data-aba="ajuda">Ajuda</button>
    </nav>
    <div class="sino-caixa">
      <button id="sino" class="sino" type="button" aria-label="Atualizações do Prumo QA: nenhuma novidade" aria-describedby="sino-dica">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3a6 6 0 0 0-6 6v3.5L4.5 16h15L18 12.5V9a6 6 0 0 0-6-6zm-2 15a2 2 0 0 0 4 0z" fill="currentColor"/></svg>
        <span id="sino-ponto" class="ponto" hidden></span>
      </button>
      <div id="sino-dica" class="dica" role="tooltip" hidden></div>
    </div>
  </header>
  <main id="conteudo" tabindex="-1"></main>
  <div id="aviso" role="status" aria-live="polite" hidden></div>
  <script src="app.js"></script>
</body>
</html>
