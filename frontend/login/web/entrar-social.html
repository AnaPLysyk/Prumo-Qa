<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Entrar no Prumo QA</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0d1424; color: #f1f5f9; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { box-sizing: border-box; width: min(420px, 94vw); padding: 32px; background: #192337; border: 1px solid #34435e; border-radius: 16px; }
    h1 { font-size: 1.45rem; margin: 0 0 12px; }
    p { color: #c7d2e5; line-height: 1.55; }
    button { display: block; box-sizing: border-box; width: 100%; margin: 12px 0; padding: 12px; border-radius: 8px; border: 1px solid #697e9c; background: #283a56; color: white; font: inherit; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #estado { min-height: 2em; }
  </style>
</head>
<body>
  <main>
    <h1>Entrar no Prumo QA</h1>
    <p>Confirme sua identidade usando o navegador. Esta autorização não dá acesso aos seus repositórios.</p>
    <button type="button" id="github" disabled>Continuar com GitHub</button>
    <button type="button" id="google" disabled>Continuar com Google</button>
    <p id="estado" role="status" aria-live="polite">Verificando solicitação segura…</p>
  </main>
  <script type="module" src="/entrar-social.js"></script>
</body>
</html>
