# Instalador Windows (NSIS). Gerar: npm run dist  ->  release/Prumo-QA-Setup-<versão>.exe
appId: com.anaplysyk.prumoqa
# Protocolo exclusivo do aplicativo para o futuro retorno OAuth via navegador.
# O handler de autenticação ainda depende da integração PKCE no processo principal.
protocols:
  - name: Prumo QA Identity
    schemes:
      - com.anaplysyk.prumoqa
productName: Prumo QA
executableName: Prumo QA
copyright: Ana P. Lysyk
# Sem asar: o servidor MCP (dist/mcp.js) e o aprovar.exe precisam existir como arquivos reais no disco.
asar: false
directories:
  output: release
  buildResources: assets
files:
  - dist/**
  - backend/aplicativo/preload.cjs
  - docs/ajuda/**
  - docs/catalogo/**
  - assets/**
  - backend/agentes/skills/**
  - backend/testes/reporters/**
  - docs/AGENDAMENTOS.md
  - docs/SERVICOS.md
  - package.json
  - "!dist/**/*.map"
  - "!dist/**/*.d.ts"
  - "!dist/**/*.fonte.sha256"
extraResources:
  # Projeto de demonstração (somente leitura na instalação; o app o copia para LOCALAPPDATA ao vincular).
  - from: backend/projetos/exemplos/projeto-demo
    to: demo
    filter: ["**/*", "!.prumo/**", "!node_modules/**"]
win:
  icon: assets/prumo-icon.ico
  target:
    - target: nsis
      arch: x64
  # Sem certificado de assinatura: o instalador sai NÃO ASSINADO (veja docs/APLICATIVO.md).
  signAndEditExecutable: true
  # Gancho de assinatura: assina só se PRUMO_ASSINATURA_THUMBPRINT existir (certificado legítimo no ambiente de build);
  # sem credencial o arquivo permanece não assinado, e com credencial qualquer falha interrompe o build. Ver docs/ASSINATURA.md.
  signtoolOptions:
    sign: site/release/assinar-windows.cjs
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Prumo QA
  runAfterFinish: true
  # Desinstalar não apaga histórico nem evidências do usuário.
  deleteAppDataOnUninstall: false
  artifactName: Prumo-QA-Setup-${version}.exe
  installerIcon: assets/prumo-icon.ico
  uninstallerIcon: assets/prumo-icon.ico
publish: null
# macOS e Linux: gerados no CI (cada sistema compila o seu). Sem assinatura da Apple, o macOS mostra o aviso de
# "desenvolvedor não identificado" na primeira abertura (veja docs/ajuda/03-instalar.md). O ícone vem de assets/prumo-icon-1024.png.
mac:
  icon: assets/prumo-icon-1024.png
  category: public.app-category.developer-tools
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  target:
    - target: dmg
      arch: [arm64, x64]
  artifactName: Prumo-QA-${version}-mac-${arch}.${ext}
dmg:
  title: Prumo QA ${version}
linux:
  icon: assets/prumo-icon-1024.png
  category: Development
  synopsis: Qualidade de software do ticket à evidência
  maintainer: Ana P. Lysyk <paulalysyk1234@gmail.com>
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
  artifactName: Prumo-QA-${version}-linux-${arch}.${ext}
