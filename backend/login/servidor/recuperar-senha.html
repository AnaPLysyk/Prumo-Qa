<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Recuperar acesso · Prumo QA</title>
<style>body{font:16px system-ui;background:#101820;color:#eef4fa;display:grid;place-items:center;min-height:100vh;margin:0}main{max-width:400px;padding:30px;width:90%}input,button{box-sizing:border-box;display:block;width:100%;padding:13px;margin:14px 0;border-radius:8px;border:1px solid #596575;background:#1a2a37;color:white}button{background:#316dbd;border:0;cursor:pointer}p{line-height:1.5}</style></head>
<body><main><h1>Prumo QA</h1><p>Defina uma nova senha para sua conta.</p>
<form id="form"><label for="senha">Nova senha (mínimo 10 caracteres)</label>
<input id="senha" type="password" minlength="10" maxlength="128" autocomplete="new-password" required/>
<button type="submit">Redefinir senha</button></form><p id="estado" role="status" aria-live="polite"></p></main>
<script src="/recuperar-senha.js" defer></script></body></html>
