services:
  - type: web
    runtime: static
    name: prumo-qa-docs
    repo: https://github.com/AnaPLysyk/Prumo-Qa
    branch: main
    buildCommand: node site/construir-no-render.mjs
    staticPublishPath: site/public
    autoDeployTrigger: "off"
    previews:
      generation: manual
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action https://github.com"
  # Envia os códigos de confirmação de e-mail do aplicativo (cadastro e Esqueci a senha). Ver servico-de-email/LEIA-ME.md.
  - type: web
    runtime: node
    name: prumo-qa-email
    plan: free
    repo: https://github.com/AnaPLysyk/Prumo-Qa
    branch: main
    rootDir: servico-de-email
    buildCommand: node --version
    startCommand: node servidor.mjs
    healthCheckPath: /saude
    autoDeployTrigger: "off"
    envVars:
      - key: RESEND_API_KEY
        sync: false
      - key: PRUMO_EMAIL_REMETENTE
        sync: false
