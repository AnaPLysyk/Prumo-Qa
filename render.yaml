services:
  - type: web
    runtime: static
    name: prumo-qa-docs
    repo: https://github.com/AnaPLysyk/Prumo-Qa
    branch: main
    buildCommand: node site/construir-no-render.mjs
    staticPublishPath: site/public
    autoDeployTrigger: "off"
    previews:
      generation: manual
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action https://github.com"
  # Serviço do Prumo: códigos de confirmação por e-mail e chamados de suporte (sem GitHub para quem abre). Ver Documentação Viva e docs/ajuda/21-acesso-e-permissoes.md.
  - type: web
    runtime: node
    name: prumo-qa-servico
    plan: free
    repo: https://github.com/AnaPLysyk/Prumo-Qa
    branch: main
    buildCommand: cd backend/login/servidor && npm ci --omit=dev
    startCommand: node backend/aplicativo/servidor/servidor.mjs
    healthCheckPath: /saude/autenticacao
    autoDeployTrigger: "off"
    envVars:
      # Aplicativos oficiais do Prumo (GitHub App e Atlassian OAuth) para conectar pelo navegador: sem o conjunto completo de cada um, a rota responde 503.
      - key: PRUMO_GITHUB_APP_CLIENT_ID
        sync: false
      - key: PRUMO_GITHUB_APP_CLIENT_SECRET
        sync: false
      - key: PRUMO_GITHUB_APP_SLUG
        sync: false
      - key: PRUMO_JIRA_CLIENT_ID
        sync: false
      - key: PRUMO_JIRA_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: PRUMO_EMAIL_REMETENTE
        sync: false
      - key: PRUMO_SUPORTE_REPOSITORIO
        sync: false
      - key: PRUMO_SUPORTE_TOKEN
        sync: false
      - key: PRUMO_SUPORTE_CHAVE_ADMIN
        generateValue: true
      # Login central: banco existente do Render, sem senha no repositório.
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_URL
        value: https://prumo-qa-servico.onrender.com
      - key: BETTER_AUTH_SECRET
        generateValue: true
