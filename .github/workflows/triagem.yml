name: Triagem de issues

# Triagem SEGURA: só classifica por rótulo. Não faz checkout, não executa nem interpola o texto da issue em nenhum comando,
# não corrige código, não abre pull request e não toca na branch main. Texto de issue é dado não confiável.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/catalogo/suporte-status.json', '.github/workflows/triagem.yml']
  issues:
    types: [opened, reopened]

permissions:
  issues: write
  contents: read

jobs:
  classificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // Fonte pública de estados; somente dados validados, nunca eval ou comando de shell.
            const arquivo = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path: 'docs/catalogo/suporte-status.json' });
            const estados = JSON.parse(Buffer.from(arquivo.data.content, 'base64').toString('utf8'));
            if (!Array.isArray(estados) || estados.length !== 5 || estados.some(s => !/^status: [\p{L} ]+$/u.test(s.rotulo) || !/^[a-f0-9]{6}$/.test(s.cor))) throw new Error('Catálogo de status inválido');
            for (const s of estados) {
              try { await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: s.rotulo }); }
              catch (e) { if (e.status !== 404) throw e; await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name: s.rotulo, color: s.cor, description: s.explicacao.slice(0, 100) }); }
            }
            // Publicar o catálogo não cria chamados nem altera issues existentes.
            const issue = context.payload.issue;
            if (!issue) { core.info('Catálogo de status disponível; nenhuma issue alterada.'); return; }
            const atuais = issue.labels.map((l) => (typeof l === 'string' ? l : l.name));
            const titulo = String(issue.title || '');
            const porPrefixo = [['[Bug]', 'tipo: bug'], ['[Melhoria]', 'tipo: melhoria'], ['[Sugestão]', 'tipo: sugestão']];
            const novos = [];
            if (!atuais.some(n => n.startsWith('status: '))) novos.push(estados.find(s => s.id === 'recebido').rotulo);
            if (!atuais.some((n) => n.startsWith('tipo: '))) {
              const achado = porPrefixo.find(([p]) => titulo.startsWith(p));
              novos.push(achado ? achado[1] : 'tipo: indefinido');
            }
            if (!atuais.includes('triagem: pendente')) novos.push('triagem: pendente');
            if (novos.length) await github.rest.issues.addLabels({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, labels: novos });
