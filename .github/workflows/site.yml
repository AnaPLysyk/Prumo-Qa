name: Site e documentação

# Publica o site (prumo-qa-docs no Render) sempre que o que ele mostra muda: documentação, ajuda, catálogo de versões
# (a release marcada como publicada), capturas e o gerador. Fluxo da release: a tag gera o instalador; o commit que marca a
# versão como "publicada" altera docs/catalogo/versoes.json e dispara esta publicação com o link e o SHA-256 verificados.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'site/gerar.mjs'
      - 'docs/ajuda/**'
      - 'docs/catalogo/versoes.json'
      - 'docs/catalogo/suporte-status.json'
      - 'assets/**'
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

# 2.17.1: uma publicação por vez, em fila. A tag dispara o site duas vezes (Windows marca o catálogo; macOS/Linux anexam os
# instaladores) e cada rodada precisa terminar verde, em vez de uma cancelar a outra.
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Gerar o site (mesmo comando do Render)
        run: node site/gerar.mjs
      - name: Conferir que o site gerado cita a versão publicada do catálogo
        run: |
          node -e "
          const fs=require('fs');
          const v=JSON.parse(fs.readFileSync('docs/catalogo/versoes.json','utf8')).versions.find(x=>x.status==='publicada');
          const html=fs.readFileSync('site/public/versoes.html','utf8');
          if(!html.includes('<strong>'+v.version+'</strong>')) throw new Error('site não cita '+v.version);
          if(v.installer && !html.includes(v.installer.sha256)) throw new Error('site sem o SHA-256 de '+v.version);
          console.log('site cita '+v.version);
          "
      - name: Publicar no Render (deploy hook do serviço prumo-qa-docs)
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          # 2.17.1: sem o segredo nada publica o site; falha já, com o caminho da correção, em vez de esperar 15 minutos.
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Falta o segredo RENDER_DEPLOY_HOOK_URL (Render › prumo-qa-docs › Settings › Deploy Hook; GitHub › Settings › Secrets and variables › Actions). Sem ele, publique à mão: Manual Deploy › Deploy latest commit."
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$RENDER_DEPLOY_HOOK_URL")
          echo "Render respondeu HTTP $code"
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]
      - name: Conferir o site publicado
        run: |
          esperado=$(node -e "const v=JSON.parse(require('fs').readFileSync('docs/catalogo/versoes.json','utf8')).versions.find(x=>x.status==='publicada');console.log(v.version)")
          # 2.10.1: espera o site gerado DESTE commit (build.txt), não só a versão anunciada, que pode não ter mudado.
          for i in $(seq 1 45); do
            no_ar=$(curl -s https://prumo-qa-docs.onrender.com/build.txt | tr -d '[:space:]')
            # 2.17.1: um commit mais novo da main no ar também serve, desde que contenha este (outra publicação passou na frente).
            contem=nao
            if [ -n "$no_ar" ] && [ "$no_ar" != "$GITHUB_SHA" ]; then git fetch -q origin main && git merge-base --is-ancestor "$GITHUB_SHA" "$no_ar" 2>/dev/null && contem=sim; fi
            if { [ "$no_ar" = "$GITHUB_SHA" ] || [ "$contem" = sim ]; } && curl -s https://prumo-qa-docs.onrender.com/versoes.html | grep -q "<strong>$esperado</strong>"; then echo "site no ar: commit $no_ar (contém $GITHUB_SHA), versão $esperado"; exit 0; fi
            sleep 20
          done
          echo "::error::O site no ar não passou ao commit $GITHUB_SHA (versão $esperado) em 15 minutos (no ar: ${no_ar:-desconhecido})."
          exit 1
