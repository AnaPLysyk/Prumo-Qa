name: macOS e Linux — instaladores

# Gera e confere os instaladores de macOS (.dmg, Apple Silicon e Intel) e de Linux (.AppImage e .deb), cada um na sua
# máquina real. Antes de publicar, homologa em cada sistema: smoke, integração e E2E do Prumo QA Lab (commit fixado, o
# mesmo do windows.yml) com a janela real, e o aplicativo empacotado abrindo todas as telas.
# Em tags v*, espera o fluxo do Windows criar a release, anexa os arquivos com o SHA-256 e republica o site.
# Branches prumo/homologacao-* rodam a mesma homologação sem publicar nada.
# Instaladores NÃO ASSINADOS: o macOS mostra o aviso de desenvolvedor não identificado (docs/ajuda/03-instalar.md).
on:
  push:
    tags: ['v*']
    branches: ['prumo/homologacao-*']
  pull_request:
    paths:
      - 'electron-builder.yml'
      - '.github/workflows/multiplataforma.yml'
      - 'backend/testes/aprovacao/**'
      - 'backend/conexoes/regras/servicosDoAplicativo.ts'
      - 'backend/atualizacoes/**'
      - 'backend/conexoes/integracoes/**'
      - 'backend/conexoes/servidor/**'
      - 'backend/conexoes/servicoContas.ts'
      - 'testes/unitario/backend/conexoes/**'
      - 'backend/projetos/**'
      - 'backend/testes/servicoCasos.ts'
      - 'backend/tickets/servicoPropostas.ts'
      - 'frontend/projetos/**'
      - 'testes/unitario/backend/projetos/manual-multiplataforma.test.mjs'
      - 'site/release/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multiplataforma-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instalador:
    name: ${{ matrix.nome }}
    runs-on: ${{ matrix.os }}
    # Homologação + instaladores + espera da release do Windows (que roda a regressão completa antes de publicar).
    timeout-minutes: 120
    permissions:
      contents: write
      actions: write
    env:
      PRUMO_LAB_DIR: ${{ github.workspace }}/.lab
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nome: macOS, os: macos-latest, alvo: mac }
          - { nome: Linux, os: ubuntu-latest, alvo: linux }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: AnaPLysyk/Prumo-QA-Lab
          ref: 2f2ae7c0d72af66a7563861c32514d7d29043b6d
          path: .lab
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Dependências do Linux (janela sem tela, cofre de senhas, polkit e janelas de aprovação)
        if: matrix.alvo == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libsecret-1-0 gnome-keyring dbus-x11 zenity policykit-1 libfuse2 rpm fakeroot dpkg
          # Ubuntu 24.04 restringe namespaces sem privilégio (AppArmor) e o sandbox do Chromium não abre a janela sem eles.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - name: Preparar o runtime Electron antes dos testes de janela
        # Electron 44 baixa o binário no primeiro import. Esse provisionamento não faz parte do E2E.
        run: node node_modules/electron/install.js
      - name: Dependências do servidor Better Auth (integração do Lab)
        run: npm ci --prefix backend/login/servidor --omit=dev
      - name: Tipos e compilação
        run: |
          npm run typecheck
          npm run build
      - name: Testes de plataforma (aprovação, cofre, atualização e nomes dos instaladores)
        run: node --test --test-concurrency=1 testes/unitario/backend/aplicativo/multiplataforma.test.mjs testes/unitario/backend/testes/aprovacao-multiplataforma.test.mjs
      - name: Testes das conexões pelo navegador (GitHub App e Jira OAuth) em cada sistema
        run: node --test --test-concurrency=1 testes/unitario/backend/conexoes/autorizacao-no-servidor.test.mjs testes/unitario/backend/conexoes/autorizacao-pelo-navegador.test.mjs testes/unitario/backend/conexoes/cliente-do-servico-de-autorizacao.test.mjs testes/unitario/backend/conexoes/contas-oauth.test.mjs
      # Linux: janela no Xvfb e cofre do GNOME destravado numa sessão D-Bus própria, como numa área de trabalho real.
      - name: Homologar smoke, integração e E2E do Lab com a janela real
        run: |
          # O log do Actions exige login: cada teste que falha vira uma anotação pública (nome, local e erro).
          cat > "$RUNNER_TEMP/homologar.sh" <<'FIM'
          for tipo in smoke integracao e2e; do
            echo "::group::Lab $tipo"
            node .lab/automacao/prumo-qa/executar.mjs --qa . --tipo "$tipo" | tee "$RUNNER_TEMP/lab-$tipo.log"; codigo=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ "$codigo" -ne 0 ]; then node site/release/anotar-falhas-dos-testes.mjs "$RUNNER_TEMP/lab-$tipo.log" "Lab $tipo (${{ matrix.nome }})"; exit "$codigo"; fi
          done
          FIM
          if [ "${{ matrix.alvo }}" = "linux" ]; then
            dbus-run-session -- bash -c 'printf "" | gnome-keyring-daemon --unlock --components=secrets >/dev/null && xvfb-run -a -s "-screen 0 1440x900x24" bash "$RUNNER_TEMP/homologar.sh"'
          else
            bash "$RUNNER_TEMP/homologar.sh"
          fi
      - name: Gerar instaladores
        run: npm run dist:${{ matrix.alvo }}
      - name: Verificar o executável empacotado (todas as telas)
        run: |
          if [ "${{ matrix.alvo }}" = "mac" ]; then
            exe=$(ls -d release/mac-arm64/*.app/Contents/MacOS/* release/mac/*.app/Contents/MacOS/* 2>/dev/null | head -1)
          else
            exe="release/linux-unpacked/$(node -p "require('./package.json').name")"
            [ -x "$exe" ] || exe=$(find release/linux-unpacked -maxdepth 1 -type f -perm -u+x ! -name '*.so*' ! -name 'chrome*' | head -1)
          fi
          [ -n "$exe" ] && [ -x "$exe" ] || { echo "::error::Executável empacotado não encontrado"; ls -R release | head -50; exit 1; }
          export PRUMO_APP_EXE="$PWD/$exe"; echo "Executável: $PRUMO_APP_EXE"
          cmd='node .lab/automacao/prumo-qa/executar.mjs --qa . --tipo e2e --arquivo frontend/aplicativo/todas-as-telas.test.mjs --empacotado'
          if [ "${{ matrix.alvo }}" = "linux" ]; then
            if dbus-run-session -- bash -c "printf '' | gnome-keyring-daemon --unlock --components=secrets >/dev/null && xvfb-run -a -s '-screen 0 1440x900x24' $cmd" | tee "$RUNNER_TEMP/lab-empacotado.log"; then codigo=0; else codigo=${PIPESTATUS[0]}; fi
          else
            if $cmd | tee "$RUNNER_TEMP/lab-empacotado.log"; then codigo=0; else codigo=${PIPESTATUS[0]}; fi
          fi
          if [ "$codigo" -ne 0 ]; then node site/release/anotar-falhas-dos-testes.mjs "$RUNNER_TEMP/lab-empacotado.log" "Executável empacotado (${{ matrix.nome }})"; exit "$codigo"; fi
      - name: Conferir os arquivos gerados e gerar o SHA-256
        run: |
          cd release
          ls -la
          if [ "${{ matrix.alvo }}" = "mac" ]; then arquivos=$(ls Prumo-QA-*-mac-*.dmg); else arquivos=$(ls Prumo-QA-*-linux-*.AppImage Prumo-QA-*-linux-*.deb); fi
          [ -n "$arquivos" ] || { echo "::error::Nenhum instalador gerado"; exit 1; }
          for f in $arquivos; do
            if command -v sha256sum >/dev/null; then h=$(sha256sum "$f" | cut -d' ' -f1); else h=$(shasum -a 256 "$f" | cut -d' ' -f1); fi
            echo "$h *$f" > "$f.sha256"; echo "SHA-256 $f: $h"
          done
      - uses: actions/upload-artifact@v5
        with:
          name: prumo-qa-${{ matrix.alvo }}
          path: |
            release/Prumo-QA-*-mac-*.dmg
            release/Prumo-QA-*-linux-*.AppImage
            release/Prumo-QA-*-linux-*.deb
            release/Prumo-QA-*.sha256
          if-no-files-found: error
      - name: Esperar a release do Windows e anexar os instaladores
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME}
          for i in $(seq 1 120); do
            if gh release view "$v" >/dev/null 2>&1; then break; fi
            echo "Aguardando a release $v (fluxo do Windows)…"; sleep 30
          done
          gh release view "$v" >/dev/null 2>&1 || { echo "::error::Release $v não foi criada pelo fluxo do Windows em 60 minutos"; exit 1; }
          if [ "${{ matrix.alvo }}" = "mac" ]; then gh release upload "$v" release/Prumo-QA-*-mac-*.dmg release/Prumo-QA-*-mac-*.dmg.sha256 --clobber; else gh release upload "$v" release/Prumo-QA-*-linux-*.AppImage release/Prumo-QA-*-linux-*.AppImage.sha256 release/Prumo-QA-*-linux-*.deb release/Prumo-QA-*-linux-*.deb.sha256 --clobber; fi
          echo "::notice::Instaladores de ${{ matrix.nome }} anexados à release $v"

  # 2.17.1: uma só republicação do site, depois de macOS e Linux (antes cada plataforma disparava a sua e uma cancelava a outra).
  # Roda mesmo se uma plataforma falhar: o site omite instalador ausente da release.
  site:
    name: Republicar o site com os novos instaladores
    needs: instalador
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --ref main --repo "$GITHUB_REPOSITORY"
