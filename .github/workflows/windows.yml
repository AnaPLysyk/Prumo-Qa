name: Windows — unitários, instalador e release

# Executa somente testes unitários, gera instalador, verifica SHA-256 e cria release nas tags v*.
# Preserva publicação verificada do instalador, catálogo de versões e site.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write   # dispara o fluxo do site depois de marcar a versão como publicada
    env:
      # Prumo QA Lab público, fixado por commit: a demonstração 2.8 usa uma CÓPIA dele; o laboratório não é alterado nem entra no instalador.
      PRUMO_LAB_DIR: ${{ github.workspace }}\.lab
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: AnaPLysyk/Prumo-QA-Lab
          ref: 8808e57c5c997975f6588af00d4bb52fe642861a
          path: .lab
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verificar tipos e apenas testes unitários
        shell: pwsh
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:unitarios
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Gerar instalador
        run: npm run dist
      - name: SHA-256 do instalador
        shell: pwsh
        run: |
          $setup = Get-ChildItem release\Prumo-QA-Setup-*.exe
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash *$($setup.Name)" | Out-File -Encoding ascii "release\$($setup.Name).sha256"
          "SHA-256 $($setup.Name): $hash"
      - name: Estado da assinatura do instalador (verificado, não presumido)
        shell: pwsh
        run: |
          $setup = (Get-ChildItem release\Prumo-QA-Setup-*.exe).FullName
          $ass = Get-AuthenticodeSignature $setup
          "Assinatura do instalador: $($ass.Status)"
          $assinado = ($ass.Status -eq 'Valid')
          "PRUMO_ASSINADO=$($assinado.ToString().ToLower())" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - uses: actions/upload-artifact@v5
        with:
          name: prumo-qa-instalador
          path: |
            release/Prumo-QA-Setup-*.exe
            release/Prumo-QA-Setup-*.exe.sha256
          if-no-files-found: error
      - name: Notas da release (geradas de docs/catalogo/versoes.json)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$v") { throw "A tag $($env:GITHUB_REF_NAME) não corresponde à versão $v do package.json" }
          node ferramentas/release/notas-versao.mjs $v | Out-File -Encoding utf8 release-notes.md
      - name: Criar release (instalador não assinado)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Prumo-QA-Setup-*.exe
            release/Prumo-QA-Setup-*.exe.sha256
          body_path: release-notes.md
      - name: Conferir a release publicada (instalador idêntico ao gerado)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $pagina = Invoke-WebRequest "https://github.com/AnaPLysyk/Prumo-Qa/releases/tag/v$v" -UseBasicParsing
          if ($pagina.StatusCode -ne 200) { throw "Release v$v não encontrada" }
          $baixado = Join-Path $env:RUNNER_TEMP "publicado-$v.exe"
          Invoke-WebRequest "https://github.com/AnaPLysyk/Prumo-Qa/releases/download/v$v/Prumo-QA-Setup-$v.exe" -OutFile $baixado
          $hash = (Get-FileHash $baixado -Algorithm SHA256).Hash.ToLower()
          $local = (Get-FileHash (Get-ChildItem release\Prumo-QA-Setup-*.exe).FullName -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $local) { throw "O instalador publicado difere do gerado: $hash <> $local" }
          "Release v$v conferida; SHA-256 $hash"
          "SHA256_PUBLICADO=$hash" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      # Fim da rotina (2.10.1): com a release conferida, o catálogo passa a "publicada" (data, link e SHA-256) num commit na main
      # e o site é publicado a partir dele. O aplicativo instalado das pessoas avisa sozinho (sino + notificação do Windows).
      - name: Marcar a versão como publicada no catálogo e publicar o site
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $data = [System.TimeZoneInfo]::ConvertTimeBySystemTimeZoneId((Get-Date), 'E. South America Standard Time').ToString('yyyy-MM-dd')
          git fetch --no-tags origin main
          git checkout -B main origin/main
          node ferramentas/release/publicar-versao.mjs $v $env:SHA256_PUBLICADO $data
          if ($LASTEXITCODE -ne 0) { throw "Não foi possível marcar $v como publicada no catálogo" }
          git diff --quiet -- docs/catalogo/versoes.json
          if ($LASTEXITCODE -ne 0) {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs/catalogo/versoes.json
            git commit -m "docs($v): catálogo marca a $v como publicada (release, instalador e SHA-256 conferidos pelo CI)"
            git push origin main
            if ($LASTEXITCODE -ne 0) { throw "Falha ao enviar o catálogo publicado para a main" }
          } else { "Catálogo já marcava $v como publicada." }
          # Push feito com o token do Actions não dispara outros fluxos: o site é disparado explicitamente.
          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/site.yml/dispatches" `
            -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' } -ContentType 'application/json' -Body '{"ref":"main"}'
          "::notice::$v publicada: release, catálogo e site disparado. O aplicativo instalado avisa as pessoas sozinho."
